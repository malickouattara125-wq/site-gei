# Mise en ligne automatique du site GEI chez LWS (cPanel).
# - Se lance tout seul à chaque modification de la branche main.
# - Peut aussi être lancé à la main : onglet Actions → « Déployer sur LWS » → Run workflow.
# Les accès LWS sont rangés dans les secrets du dépôt (Settings → Secrets and variables → Actions) :
#   LWS_HOST, LWS_USER, LWS_PASSWORD, LWS_DOMAIN, ADMIN_PASSWORD
name: Déployer sur LWS

on:
  push:
    branches: [main]
    paths-ignore: ["docs/**", "**.md"]
  workflow_dispatch:
    inputs:
      mode:
        description: "diagnostic = vérifier l'accès sans rien envoyer · deployer = mettre en ligne"
        type: choice
        options: [deployer, diagnostic]
        default: deployer

concurrency:
  group: deployer-lws
  cancel-in-progress: false

jobs:
  lws:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      LWS_HOST: ${{ secrets.LWS_HOST }}
      LWS_USER: ${{ secrets.LWS_USER }}
      LWS_PASSWORD: ${{ secrets.LWS_PASSWORD }}
      LWS_DOMAIN: ${{ secrets.LWS_DOMAIN }}
      ADMIN_PASSWORD: ${{ secrets.ADMIN_PASSWORD }}
    steps:
      - name: Accès LWS enregistrés ?
        id: secrets
        run: |
          missing=""
          for v in LWS_HOST LWS_USER LWS_PASSWORD LWS_DOMAIN; do [ -n "${!v}" ] || missing="$missing $v"; done
          if [ -n "$missing" ]; then
            echo "::notice::Mise en ligne ignorée : secrets manquants :$missing"
            echo "ready=0" >> "$GITHUB_OUTPUT"
          else
            echo "ready=1" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.secrets.outputs.ready == '1'

      - name: Diagnostic de l'hébergement
        id: diag
        if: steps.secrets.outputs.ready == '1'
        run: .github/lws/lws.sh diagnostic

      - name: Préparer le redémarrage du serveur
        if: steps.secrets.outputs.ready == '1' && inputs.mode != 'diagnostic'
        run: mkdir -p serveur/tmp && date -u +%FT%TZ > serveur/tmp/restart.txt

      - name: Envoyer les fichiers (FTP sécurisé, seulement ce qui a changé)
        if: steps.secrets.outputs.ready == '1' && inputs.mode != 'diagnostic'
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.LWS_HOST }}
          username: ${{ secrets.LWS_USER }}
          password: ${{ secrets.LWS_PASSWORD }}
          protocol: ftps
          server-dir: site-gei/
          exclude: |
            **/.git*
            **/.git*/**
            .github/**
            docs/**
            **/*.md
            serveur/data/**
            serveur/uploads/**
            serveur/demarrer.bat

      - name: Déclarer l'application Node.js
        if: steps.secrets.outputs.ready == '1' && inputs.mode != 'diagnostic'
        env:
          HOME_DIR: ${{ steps.diag.outputs.home }}
          FORCE_HTTPS: ${{ steps.diag.outputs.https }}
        run: .github/lws/lws.sh application

      - name: Vérifier le site en ligne
        if: steps.secrets.outputs.ready == '1' && inputs.mode != 'diagnostic'
        run: .github/lws/lws.sh verifier
